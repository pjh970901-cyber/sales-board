<script>(function(){var real=window.fetch.bind(window),give;var ready=new Promise(function(r){give=r});window.__staticApi=give;window.fetch=function(u,o){var s=typeof u==="string"?u:(u&&u.url)||"";if(s.indexOf("/api/")!==0)return real(u,o);return ready.then(function(h){return h(s,o||{})})}})();</script>
<script>
(function () {
  var page = document.getElementById("page");
  function uploadReady(fn) { if (window.SalesUpload) fn(); else window.addEventListener("sales-upload-ready", fn, { once: true }); }
  function fail(msg, empty) {
    page.innerHTML = '<div class="card load-fail"><h2 class="card-title">숫자를 불러오지 못했습니다</h2><p class="muted">' + String(msg).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])) + '</p><div class="sheet-actions"><button class="btn primary" type="button" id="retryLoad">다시 시도</button></div></div>';
    document.getElementById("retryLoad").onclick = load;
    if (empty) { var btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "엑셀 올리기"; btn.onclick = function () { btn.disabled = true; uploadReady(function () { window.SalesUpload.mountEmpty().catch(function () { fail("엑셀 올리기 화면을 불러오지 못했습니다", true); }); }); }; page.querySelector(".sheet-actions").appendChild(btn); }
  }
  function load() {
    page.innerHTML = '<p class="muted load-wait" role="status">숫자를 불러오는 중입니다…</p>';
    var unauthorized = false;
    function get(url, fallback) {
      return fetch(url, { credentials: "same-origin", headers: { Accept: "application/json" } }).then(function (r) {
        if (r.status === 401) { unauthorized = true; location.replace("./"); return null; }
        if (url === "/api/pack" && r.status === 404) { var error = new Error("아직 올라온 판매 자료가 없습니다. 아래 '엑셀 올리기'로 올려 주세요."); error.empty = true; throw error; }
        if (!r.ok) throw new Error(r.status === 404 ? "아직 올라온 판매 자료가 없습니다. 아래 '엑셀 올리기'로 올려 주세요." : "서버 응답 오류 (" + r.status + ")");
        return r.json();
      }).catch(function (e) { if (fallback !== undefined) return fallback; throw e; });
    }
    Promise.all([get("/api/pack"), get("/api/settings", { version: null, values: {} }), get("/api/meta", {}), get("/api/stock", null), get("/api/winner", null)]).then(function (results) {
      if (unauthorized || !results[0]) return;
      window.MOCK = results[0]; window.SETTINGS = results[1]; window.META = results[2]; window.STOCK = results[3]; window.WINNER = results[4];
      var el = document.createElement("script");
      el.textContent = document.getElementById("appSrc").textContent;
      document.body.appendChild(el);
    }).catch(function (e) { fail(e && e.message ? e.message : "네트워크 오류", e.empty); });
  }
  load();
})();
</script>
<script type="text/plain" id="appSrc">
"use strict";
const D = window.MOCK;
/* '점검 필요'에는 재고 이야기를 넣지 않습니다 (사용자 요청 2026-11-09). 수집기도 이제 재고를 보고서에 주지 않지만, 그 전에 쓴 글에서도 재고·입고·품절 줄은 뺍니다 */
(() => {
  const stock = /재고|입고|품절/;
  const clean = (reps) => { for (const r of Object.values(reps || {})) { const x = r?.report || r; if (x && Array.isArray(x.suggestions)) x.suggestions = x.suggestions.filter((l) => !stock.test(String(l))); } };
  clean(D.reports); clean(D.aiLive?.reports); clean(D.aiOlder);
})();
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const remScale = () => (parseFloat(getComputedStyle(document.documentElement).fontSize) || 16) / 16; // 화면 맞춤: 지금 1rem 이 기준(16px)의 몇 배인지
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = new Intl.NumberFormat("ko-KR");

/* ---------- 숫자 표시 ---------- */
function man(v) { // 입력 단위: 원
  const a = Math.abs(v), sign = v < 0 ? "-" : "";
  if (a >= 100000000) {
    const x = a / 100000000;
    const s = a >= 1000000000 ? x.toFixed(1) : x.toFixed(2);
    return sign + s.replace(/\.?0+$/, "") + "억";
  }
  return sign + nf.format(Math.round(a / 10000)) + "만";
}
function manLong(v) {
  const sign = v < 0 ? "-" : "";
  const a = Math.round(Math.abs(v) / 10000);
  const eok = Math.floor(a / 10000), rest = a % 10000;
  if (!eok) return sign + nf.format(rest) + "만";
  return sign + eok + "억" + (rest ? " " + nf.format(rest) + "만" : "");
}
function wonFull(v) { return v == null ? "-" : nf.format(v) + "원"; }
function won(v) { return v == null ? "-" : (v / 10000).toFixed(1).replace(/\.0$/, "") + "만원"; }
function pct(c, p) { if (!p) return null; return ((c - p) / Math.abs(p)) * 100; }
function delta(c, p, opt = {}) {
  const v = opt.pp != null ? opt.pp : pct(c, p);
  if (v == null) return '<span class="delta flat">비교 없음</span>';
  const unit = opt.pp != null ? "포인트" : "%";
  if (Math.abs(v) < 0.05) return `<span class="delta flat">변화 없음</span>`;
  const up = v > 0;
  return `<span class="delta ${up ? "up" : "down"}"><span aria-hidden="true">${up ? "▲" : "▼"}</span><span class="sr-only">${up ? "증가" : "감소"}</span>${up ? "+" : "-"}${Math.abs(v).toFixed(1)}${unit}</span>`;
}
// 툴팁 글은 속성에서 한 번 풀린 뒤 innerHTML로 들어가므로 두 번 감쌉니다
const esc2 = (v) => esc(esc(v));
const cleanName = (n) => String(n); // 사이니지: 모델명 시트의 이름(예: 비즈TV 43)을 그대로 씁니다

/* 브리핑: 수집 PC가 매일 17:50에 올린 AI 글(보고서 한 줄 + 근거 문장)을 모읍니다. 전체 → 마켓 순, 이번 주 진행 중 → 지난주 마감 → 전월 → 전일 */
const BRIEFS = (() => {
  if (!D.briefMeta) return [];
  const out = [], scopes = ["전체", ...D.markets.map((m) => m.name)];
  const sets = [[D.aiLive?.reports, "전주", "이번 주 진행 중"], [D.reports, "전주", "지난주 마감"], [D.reports, "전월", "이번 달 같은 기간"], [D.reports, "동요일", "전주 동요일"]];
  for (const sc of scopes) for (const [src, tab, label] of sets) {
    const r = src?.[`${sc}|${tab}`];
    if (r) out.push({ who: "ai", kind: `${sc} ${label}`, when: D.briefMeta.at, text: r.headline, facts: [...r.summary, ...r.drivers, ...r.suggestions, `결론: ${r.conclusion}`] });
  }
  return out;
})();

/* 다른 품목으로 나간 사은품을 같은 전표의 본품에 연결 (기준 달 누계 집계) */
const LINKED_GIFTS = Object.fromEntries(Object.entries(D.linkedGifts || {}).map(([k, v]) => [k, `어깨끈 ${nf.format(v)}개 (같은 주문에 포함)`]));

const BASE_MS = Date.parse(`${D.baseDate}T00:00:00Z`);
const offDate = (o) => new Date(BASE_MS + o * 864e5);
const dateOff = (y, m, d) => Math.round((Date.UTC(y, m, d) - BASE_MS) / 864e5);
const dowOf = (o) => (offDate(o).getUTCDay() + 6) % 7; // 월=0 … 일=6
const DOW = "월화수목금토일";
const md = (o) => { const d = offDate(o); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
const monthStart = (o) => { const d = offDate(o); return dateOff(d.getUTCFullYear(), d.getUTCMonth(), 1); };
const monthEnd = (o) => { const d = offDate(o); return dateOff(d.getUTCFullYear(), d.getUTCMonth() + 1, 0); };
const SLIP = new Set(D.slipDays), FIRST_DAY = D.slipDays[0], ASOF = D.asOfOff;
const HOLIDAYS = new Set(D.holidays || []);
// 회색 칸: 주말·공휴일(대체·임시 포함)·지난날 중 전표 없는 날
const offDay = (o) => dowOf(o) > 4 || HOLIDAYS.has(o) || (o <= ASOF && !SLIP.has(o));
const PIDX = Object.fromEntries(D.periods.map((p, i) => [p.id, i]));
const MPID = D.periods.filter((p) => p.group === "월").map((p) => p.id);
const LM = D.monthly.length - 1;
const monName = (i) => { const m = D.monthly[i]; return `${m.ym.slice(0, 4) === D.asOf.slice(0, 4) ? "" : m.ym.slice(2, 4) + "년 "}${m.month}월`; };
const monIdxOf = (o) => D.monthly.findIndex((m) => m.ym === offDate(o).toISOString().slice(0, 7));
const monStart = (i) => { const [y, m] = D.monthly[i].ym.split("-").map(Number); return dateOff(y, m - 1, 1); };
const mdlTarget = (m, i) => D.monthly[i].ym.slice(0, 4) === D.asOf.slice(0, 4) ? m.targets?.[D.monthly[i].month - 1] || null : null;
const prevMonName = () => { const d = offDate(monthStart(ASOF) - 1); return `${d.getUTCFullYear() === offDate(ASOF).getUTCFullYear() ? "" : String(d.getUTCFullYear()).slice(2) + "년 "}${d.getUTCMonth() + 1}월`; };

/* ---------- 상태 ---------- */
const S = {
  loading: true, drawer: false, modal: false, sort: "qty-desc",
  rtab: "전일", reportAlertsOpen: false, rbasis: "default", sumOpen: new Set(), actEdit: null, yHalf: null, yQ: null, heroTable: false, scope: "전체", editingMain: false, mainQuery: "", marketMetric: "rev", productMetric: "qty",
  page: "glance", mode: "week", base: "done", cmp: "prev", metric: "rev", table: false, // 처음 열면 '한눈에' (2026-11-17)
  drDate: null, maUnit: "m", maDate: null, svCat: "전체", svSort: "days", // 모델별 › 재고 보기: 모델군 · 정렬
  // 일일 보고서: 고른 날(null = 자료 마지막 날) · 마켓별: 기간 단위 · 고른 날짜
  ovUnit: "m", ovDate: null, ovCat: "전체", ovTile: "rev", // 기간 비교: 기간 단위(d 일간 · w 주간 · m 월간 · y 연간) · 고른 날짜(null = 자료 마지막 날) · 모델군 · 고른 타일. 마켓은 scope
  gPeriod: "mtd", gOpen: null, gZero: new Set(), gNames: false, gAcc: false, // 한눈에: 기간 · 펼친 모델군(null = 가장 많이 팔린 모델군 하나) · 판매 없는 모델을 보인 모델군 · 판매 없는 모델 이름 · 부속 묶음 펼침
  goalMo: LM, skuMonth: LM, pview: "compare", pUnit: "month", pMonth: LM, pWeekStart: ASOF - dowOf(ASOF), skuTab: "model", skuSort: "name", skuQ: "", skuOpen: new Set(), pdOpen: new Set(),
  // 주요 모델을 아직 저장하지 않았으면 이번 달 많이 팔린 5개 (사이니지: 주력 모델 TOP 5)
  main: new Set([...D.models].sort((a, b) => (b.mtdQty || 0) - (a.mtdQty || 0)).slice(0, 5).map((m) => m.code)),
  selMarket: "네이버", selModel: D.models[0]?.code ?? "", alertTab: "open", q: "", cat: "전체", onlyMain: false,
  alerts: [],
  pairA: null, pairB: null, cmpMetric: "qty", sheetCtx: null,
  tsort: { daily: null, sku: null }, settings: false,
};
const PAGES = [ // 보이는 이름만 바꿈(2026-11-17 장부형). id 는 그대로 — 코드 · 주석의 '한눈에' = glance, '요약 탭' = summary(일일 보고서), '개요' = overview, '상품' = products, '이상' = alerts
  { id: "glance", label: "요약", icon: "grid-nine", eyebrow: "목표 진척과 모델군 × 마켓" },
  { id: "overview", label: "개요", icon: "squares-four", eyebrow: "기간별 핵심 숫자" },
  { id: "markets", label: "마켓별", icon: "storefront", eyebrow: "마켓별 매출" },
  { id: "products", label: "모델별", icon: "package", eyebrow: "모델별 판매량 · 재고" },
  { id: "alerts", label: "확인할 것", icon: "warning-circle", eyebrow: "이상 감지" },
  { id: "summary", label: "일일 보고서", icon: "clipboard-text", eyebrow: "하루 판매 현황" },
];
D.models.forEach((m) => { if (!m.cat) m.cat = "기타"; }); // 분류가 없는 모델은 '기타' 단추로
const modelByCode = Object.fromEntries(D.models.map((m) => [m.code, m]));
// 0원 사은품 전용 품목(어깨끈 등): 상품 목록에는 없고 SKU 분석·엑셀에만 넣어 합계를 맞춥니다
const GIFT_MODELS = (D.giftOnly || []).map((c) => ({ code: c, name: (D.names[c] || [c])[0], cat: "사은품", targets: [], gift: true }));
const mkByName = Object.fromEntries(D.markets.map((m) => [m.name, m]));
const nameCount = D.models.reduce((o, m) => ((o[cleanName(m.name)] = (o[cleanName(m.name)] || 0) + 1), o), {});
const dname = (m) => (nameCount[cleanName(m.name)] > 1 ? cleanName(m.code.replace("*", "")) : cleanName(m.name));
const openCount = () => S.alerts.filter((a) => a.state === "open").length;


/* ---------- 기간 달력 ----------
   한 번 누르면 탭 단위(전일 하루 · 전주 월~일 · 전월 한 달)로 통째 고릅니다.
   최근 기간을 고르면 이전 기간은 바로 앞 같은 단위로 자동으로 들어가고, '이전 기간'을 눌러 바꿀 수 있습니다. */
const UNIT_TEXT = { d: "하루 단위", w: "주 단위 (월~일)", m: "한 달 단위" };
const calUnit = (ctx) => (ctx === "report" ? { 전일: "d", 전주: "w", 전월: "m" }[S.rtab] : S.mode === "month" ? "m" : "w");
const calPair = (ctx) => (ctx === "report" ? reportPair() : getPair());
function calPresets(ctx) { // [이전, 최근, 이름, 적용할 설정]
  if (ctx === "report") return {
    전일: [["dW", "d0", "지난주 같은 요일과 비교", { rbasis: "default" }]],
    전주: [["w9", "w10", "지난주 마감", { rbasis: "default" }], ["wtdPrev", "wtd", "이번 주 진행 중", { rbasis: "live" }]],
    전월: [["mtdPrev", "mtd", "이번 달 같은 기간", { rbasis: "default" }], ...(LM >= 2 ? [[MPID[LM - 2], MPID[LM - 1], "지난달 마감", { rbasis: "closed" }]] : [])],
  }[S.rtab];
  return S.mode === "month"
    ? [["mtdPrev", "mtd", "이번 달 같은 기간", {}], ...(LM >= 2 ? [[MPID[LM - 2], MPID[LM - 1], "지난달 마감", { pairs: true }]] : [])]
    : [["w9", "w10", "지난주 마감", { base: "done", cmp: "prev" }], ["wtdPrev", "wtd", "이번 주 진행 중", { base: "wtd" }], ["w6", "w10", "4주 전과 비교", { base: "done", cmp: "prev4" }]];
}
// 휴대폰에서 필터 줄을 접었을 때 보이는 단추 (지금 조건 요약)
function filtersMore(ctx) {
  const [A, B] = calPair(ctx), sum = ctx === "report" ? `${plabel(A)} → ${plabel(B)} · ${S.scope}` : `${plabel(A)} → ${plabel(B)}`;
  return `<button class="btn small filters-more" type="button" data-filters-more aria-expanded="${!!S.fOpen}"><i class="ph ph-sliders-horizontal" aria-hidden="true"></i><span>${esc(sum)}</span><i class="ph ph-caret-${S.fOpen ? "up" : "down"}" aria-hidden="true"></i></button>`;
}
function calButton(ctx, label) { // 위 필터 줄: 이전 → 최근 순
  const [A, B] = calPair(ctx);
  return `<div class="select-wrap"><span class="cal-lbl">${esc(label)}</span><button class="select cal-btn" type="button" data-cal="${ctx}" aria-haspopup="dialog" aria-label="${esc(label)} 기간 고르기: 최근 ${esc(plabel(B))}, 이전 ${esc(plabel(A))}"><i class="ph ph-calendar-blank" aria-hidden="true"></i><span>${esc(plabel(A))} <span class="cal-vs">vs</span> ${esc(plabel(B))}</span></button><i class="ph ph-caret-down caret" aria-hidden="true"></i></div>`;
}
function calField(ctx, side, pid) { // 기간 비교 칸: 한쪽 기간
  return `<div class="select-wrap" style="width:100%"><button class="select cal-btn" type="button" data-cal="${ctx}" data-side="${side}" aria-haspopup="dialog" aria-describedby="cmpL${side}"><i class="ph ph-calendar-blank" aria-hidden="true"></i><span>${esc(plabel(pid))}</span></button><i class="ph ph-caret-down caret" aria-hidden="true"></i></div>`;
}
function unitRange(u, o) {
  if (u === "d") return [o, o];
  if (u === "w") { const s0 = o - dowOf(o); return [s0, Math.min(s0 + 6, ASOF)]; }
  return [monthStart(o), Math.min(monthEnd(o), ASOF)];

const glancePeriod = (pds = glancePeriods()) => pds.find((p) => p.id === S.gPeriod) || pds[0];
function glanceData(pd) {
  const i = PIDX[pd.pid], MK = D.markets.map((m) => m.name);

  const catBy = Object.fromEntries((D.catalog || []).map((c) => [c.code, c])); // 모델명 시트에 등록된 본품 모델 전부(판매가 없어도)

  const models = codes.map((code) => {
    const m = modelByCode[code], reg = catBy[code], nm = D.names[code] || (reg ? [reg.name, reg.cat] : [code, ""]), cat = nm[1] || "", tsrc = reg || m; // 목표는 등록 목록이 먼저

      rev: at(D.modelTotals[code], "rev"), target: tsrc && pd.mo != null ? mdlTarget(tsrc, pd.mo) : null, active: qty !== 0 || MK.some((k) => by[k] !== 0) };
  });

// 부속(스탠드 · 브라켓): 고른 기간에 줄이 있는 품목만. 하나도 없으면 null → 묶음을 숨김. free = 금액이 빈칸인 줄의 수량('함께 나간 부속')
function glanceAcc(i, MK) {
  const items = Object.entries(D.accessories?.items || {}).map(([sku, it]) => {
    const by = Object.fromEntries(MK.map((k) => [k, it.by?.[k]?.qty?.[i] || 0])), tot = (f) => MK.reduce((t, k) => t + (it.by?.[k]?.[f]?.[i] || 0), 0);
    const x = { sku, name: it.name || sku, kind: it.kind || "", by, qty: tot("qty"), rev: tot("rev"), free: tot("free") };
    return { ...x, active: x.qty !== 0 || x.rev !== 0 || x.free !== 0 || MK.some((k) => by[k] !== 0) };
  }).filter((x) => x.active).sort((a, b) => b.qty - a.qty || a.name.localeCompare(b.name, "ko"));
  if (!items.length) return null;
  const tot = (f) => items.reduce((t, x) => t + x[f], 0);
  return { items, by: Object.fromEntries(MK.map((k) => [k, items.reduce((t, x) => t + x.by[k], 0)])), qty: tot("qty"), rev: tot("rev"), free: tot("free") };
}
// 부속 한 줄 풀이: 금액 없이 본품에 딸려 나간 것 = '함께 나간 부속', 금액이 있는 것은 수량과 매출을 따로

const glanceDefaultOpen = (G) => { const top = G.groups.filter((g) => g.qty > 0).sort((a, b) => b.qty - a.qty)[0]; return new Set(top ? [top.cat] : []); };
const gxPct = (a, b) => (b > 0 ? Math.round((a / b) * 100) : null);
const gxArrow = (up) => `<span aria-hidden="true">${up ? "▲" : "▼"}</span>`;
// 증감: 색 + 화살표 + 말. 이전 값이 0 이면 '비교 없음', 5 미만이면 비율을 내지 않음
function gxDelta(cur, prev) {
  if (!(prev > 0)) return `<span class="gx-flat">비교 없음</span>`;
  if (prev < 5) return `<span class="gx-flat">이전 소량(${nf.format(prev)}대)</span>`;
  const d = cur - prev, p = Math.round((d / prev) * 100);
  if (d === 0) return `<span class="gx-flat">같음</span>`;
  return d > 0 ? `<span class="gx-up">${gxArrow(true)} ${nf.format(d)}대 늘음 (+${p}%)</span>` : `<span class="gx-down">${gxArrow(false)} ${nf.format(-d)}대 줄음 (${p}%)</span>`;
}
// 목표 대비 말. 진행 중인 달은 기대 진도와, 마감한 달은 목표(100%)와 견줌. short = 좁은 칸용(말은 줄 제목의 풀이와 화면 낭독용 글자로)
function gxPace(p, pd, short) {
  if (p == null) return `<span class="gx-flat">목표 없음</span>`;

// 진척 막대: 채움 + 기대 진도 세로선. 목표를 넘기면 막대 전체 = 실적, 목표(100%) 자리에 눈금

/* ===== 팀장님 요약표(2026-11-18 시안 B): 연 · 월 · 일 매출 × 목표 · 실적 · 진척율 · 성장율 — 요약 탭 · 일일 보고서 맨 위 =====

/* ---------- 히어로: 벤토 타일 6개 ---------- */
/* 종합 분석 글 표시: 기간은 '10월'·'지난주'처럼 말로, 증감 숫자는 빨강(증가)·파랑(감소)으로 칠합니다. 저장된 글은 바꾸지 않습니다 */
function plainPeriods(text, v) {
  if (S.rpair || !text) return text;
  const day = (pid) => { const d = offDate(rangeOf(pid)[0]); return [d.getUTCMonth() + 1, d.getUTCDate()]; };
  const [am, ad] = day(v.A), [bm, bd] = day(v.B);
  const name = S.rtab === "전월" ? [`${am}월`, `${bm}월`] : S.rtab === "전주" ? (S.rbasis === "live" ? ["지난주", "이번 주"] : ["전전주", "지난주"]) : [null, null];
  return text.replace(/(\d{1,2})\/(\d{1,2})(\([^)]\))?(~\d{1,2}\/\d{1,2}(\([^)]\))?)?/g, (all, m, d) => {
    if (+m === am && +d === ad && name[0]) return name[0];
    if (+m === bm && +d === bd && name[1]) return name[1];
    return all;
  });
}
function hiText(raw, v) {

    sg ? `<span class="hl ${sg === "+" ? "up" : "down"}">${sg}${num}${w1 ?? ""}</span>` : `<span class="hl ${cls(w2)}">${pc}${sp}${w2}</span>`);
}
/* 한 줄 브리핑: AI 글이 있으면 AI, 없으면 숫자로 만든 문장 */

/* ---------- 보고서 본문 카드 ---------- */
function channelList(v) {
  const { A, B, rows } = v, byMarket = S.scope === "전체";
  let list;
  if (byMarket) list = D.markets.map((m) => ({ name: m.name, a: totalAt(D.marketTotals[m.name], A), b: totalAt(D.marketTotals[m.name], B) }));
  else {
    const cats = {};
    rows.forEach((r) => {
      const c = (cats[r.cat || "기타"] ||= { name: r.cat || "기타", a: { qty: 0, rev: 0 }, b: { qty: 0, rev: 0 } });
      ["a", "b"].forEach((k) => { c[k].qty += r[k].qty; c[k].rev += r[k].rev; });
    });

// 문장에서 먼저 나오는 말로 상승·하락·참고를 가립니다 (AI 문장을 바꾸지 않고 표시만 붙임)

/* 보고서 추이 줄: 전일은 최근 일별, 전주는 주별, 전월은 월별 (화면 차트·인쇄 보고서가 함께 씁니다) */

function withReportTab(tab, fn) {
  const keep = [S.rtab, S.rpair, S.scope, S.rbasis];

const toneCls = (x, y) => (!Math.round(x - y) ? "" : x > y ? "hl up" : "hl down"); // 한국식: 오르면 빨강, 내리면 파랑
const eok = (v) => (v == null ? "-" : `${(v / 1e8).toFixed(Math.abs(v) >= 1e10 ? 0 : 1)}억`);
const manCell = (v) => (v == null ? "-" : nf.format(Math.round(v / 10000)));
const ddOf = (s) => `${Number(s.slice(5, 7))}/${Number(s.slice(8, 10))}`;
/* 최근 8번의 같은 비교 기간: kind d = 같은 요일 하루씩, w = 월요일부터 기준 요일까지 */
function sumTrend(kind, t = D.companyTotals) {

    const s = 7 * (7 - k), pid = kind === "d" ? `Dd:${ASOF - s}-${ASOF - s}` : `Dw:${ws - s}-${ASOF - s}`;
    return { label: md(kind === "d" ? ASOF - s : ws - s), ...totalAt(t, pid) };
  });
}
/* 작은 막대 추이 (SVG): 마지막 막대가 지금 기간(진한 색), 막대 위 숫자는 만원(매출) 또는 개 */
function miniBars(pts, key, aria, unit) {
  const W = 336, H = 112, n = pts.length, bw = W / n, max = Math.max(1, ...pts.map((p) => p[key])), top = 18, base = H - 20;
  const val = (v) => (unit === "만원" ? nf.format(Math.round(v / 10000)) : nf.format(Math.round(v)));
  const bars = pts.map((p, i) => {
    const h = Math.max(p[key] > 0 ? 2 : 0, ((Math.max(0, p[key]) / max) * (base - top))), x = i * bw + bw * 0.18, cur = i === n - 1;
    return `<g><title>${esc(p.label)} ${esc(val(p[key]))}${unit}</title><rect x="${x.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${h.toFixed(1)}" rx="2" class="${cur ? "mb-cur" : "mb-prev"}"/>
      <text x="${(x + bw * 0.32).toFixed(1)}" y="${(base - h - 4).toFixed(1)}" class="mb-v${cur ? " mb-strong" : ""}">${esc(val(p[key]))}</text><text x="${(x + bw * 0.32).toFixed(1)}" y="${H - 5}" class="mb-l">${esc(p.label)}</text></g>`;
  }).join("");
  return `<svg class="mini-bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}"><line x1="0" x2="${W}" y1="${base}" y2="${base}" class="mb-axis"/>${bars}</svg>`;

/* 1·4. 실적 요약 표 + 추이 */
function kpiBlock(v, cmpName, kind) {

/* 주요 모델 한 줄 아래 마켓별 판매량 줄 (판매량 많은 순) */
const sumQtyCells = (x, y) => `<td class="num">${esc(units(x))}</td><td class="num sum-now">${esc(units(y))}</td><td class="num">${signedValue(y - x)}</td><td class="num"><span class="${toneCls(y, x)}">${esc(rateText(y, x))}</span></td>`;

/* 2·5. 주요 모델 판매량: 상품 탭에서 ★로 고른 주요 모델 (없으면 판매량 상위 6개). 이름을 누르면 그 아래로 마켓별 판매량이 펼쳐집니다 */
function modelBlock(v, sec, print) {

const pClampWeek = (ws) => Math.max(FIRST_DAY - dowOf(FIRST_DAY), Math.min(ASOF - dowOf(ASOF), ws));
/* 구글 시트 '월별목표'에서 판매 모델을 찾지 못한 이름: 그 모델 목표가 비어 있으므로 상품 탭에 알림 */
function planMissNote() {
  const miss = D.planUnmatched || [];
  return miss.length ? `<details class="sum-old-note plan-miss"><summary><i class="ph ph-warning" aria-hidden="true"></i> 구글 시트 '월별목표'에서 판매 모델을 찾지 못한 이름 ${miss.length}개 (그 목표는 비어 있음)</summary><p>${esc(miss.join(", "))}</p><p>판매 중인 모델이면 시트 C열 '코드'에 모델 코드(예: JBLQTUM250BLK)를 적어 주세요.</p></details>` : "";
}
/* ===== 모델별 › 재고 보기 (2026-11-18 시안 A) — 이카운트 재고(판매 창고 2.B2B · 3.대원CTS · 5.삼성-안성 합계, 수집기가 매일 올림)와 최근 28일 판매로 남은 일수 =====
   재고는 이카운트 품목코드로 오고 판매는 품목명(LH55QET…)이라, 재고 이름('이름 규격')의 첫 낱말로 맞춥니다. 부속(스탠드 · 브라켓)은 빼고 셉니다 */
const SV_DAYS = 28;
const SV_WORD = { out: "재고 없음", low: "부족", watch: "주의", ok: "적정", over: "많음", none: "판매 없음" };
const SV_SUB = { out: "팔리는데 0대", low: "14일 안에 떨어짐", watch: "30일 안", ok: "", over: "6개월 넘게 쌓임", none: "28일 동안 0대" };
const SV_ORDER = { out: 0, low: 1, watch: 2, ok: 3, over: 4, none: 5 };
function svRows() {
  if (!STOCK) return null;
  const bySku = {};
  for (const [code, q] of Object.entries(STOCK.stock)) { const k = String(STOCK.names?.[code] || code).trim().split(/\s+/)[0].toUpperCase(); if (k) bySku[k] = (bySku[k] || 0) + (Number(q) || 0); }
  const seen = new Set(), out = [], a = ASOF - SV_DAYS + 1;
  for (const c of [...(D.catalog || []), ...D.models]) {
    if (!c || seen.has(c.code) || c.cat === "부속") continue;
    seen.add(c.code);
    const skus = [...new Set([String(c.code).replace("*", ""), ...(D.modelSkus?.[c.code] || [])].map((s) => String(s).toUpperCase()))];
    const stock = skus.reduce((s, k) => s + (bySku[k] || 0), 0);
    const sold = dayVals(D.modelTotals[c.code]?.qty, a, ASOF).reduce((s, v) => s + v, 0);
    if (!stock && !(sold > 0)) continue;
    const avg = sold > 0 ? sold / SV_DAYS : 0, m = modelByCode[c.code];
    out.push({ code: c.code, name: m ? dname(m) : cleanName(c.name || c.code), cat: c.cat || m?.cat || "", stock, sold: Math.max(0, sold), avg, days: avg > 0 ? Math.round(stock / avg) : null, mos: avg > 0 ? stock / (avg * 30) : null });
  }
  const n = {}; out.forEach((r) => (n[r.name] = (n[r.name] || 0) + 1));
  out.forEach((r) => { if (n[r.name] > 1) r.name += " · " + String(r.code).replace("*", ""); }); // 같은 이름 두 가지(예: 비즈TV 55)는 품번을 붙여 구분
  return out;
}
const svState = (r) => (!(r.sold > 0) ? "none" : r.stock <= 0 ? "out" : r.days <= 14 ? "low" : r.days <= 30 ? "watch" : r.mos > 6 ? "over" : "ok");
const svDays = (r) => (!(r.sold > 0) ? "—" : r.stock <= 0 ? "0일" : r.days > 365 ? "1년 넘게" : nf.format(r.days) + "일");
function svBar(r) {
  const s = svState(r), w = s === "none" || s === "out" ? 0 : Math.max(2, (Math.min(r.days ?? 0, 90) / 90) * 100);
  return `<span class="sv-bar" aria-hidden="true"><i class="${s}" style="width:${w.toFixed(1)}%"></i><b style="left:${((14 / 90) * 100).toFixed(1)}%"></b><b style="left:${((30 / 90) * 100).toFixed(1)}%"></b></span>`;
}
function renderStockView() {
  const rows = svRows(), seg = `<div class="sv-top">${prodViewSeg()}</div>`;
  if (!rows) { $("#page").innerHTML = `<div class="sv">${seg}<p class="ov-empty">아직 올라온 재고가 없습니다. 자동 수집(매일 16:00~17:50)이 돌면 이카운트 재고가 함께 올라옵니다.</p></div>`; return; }
  const cats = ["전체", ...new Set(rows.map((r) => r.cat).filter(Boolean))];
  if (!cats.includes(S.svCat)) S.svCat = "전체";
  const list = rows.filter((r) => S.svCat === "전체" || r.cat === S.svCat)
    .sort(S.svSort === "sold" ? (x, y) => y.sold - x.sold || x.name.localeCompare(y.name, "ko") : (x, y) => SV_ORDER[svState(x)] - SV_ORDER[svState(y)] || (x.days ?? 1e9) - (y.days ?? 1e9) || y.sold - x.sold);
  const cnt = (k) => rows.filter((r) => svState(r) === k).length, total = rows.reduce((s, r) => s + r.stock, 0);

    <div class="sv-tools"><span class="gx-flbl">모델군</span>${cats.map((c) => chip("cat", c, S.svCat, c)).join("")}<span class="sv-sp"></span><span class="gx-flbl">정렬</span>${chip("sort", "days", S.svSort, "급한 순")}${chip("sort", "sold", S.svSort, "많이 팔린 순")}</div>
    <div class="sv-tw"><table class="sv-tb"><thead><tr><th scope="col">모델</th><th scope="col" class="n">재고</th><th scope="col" class="n">최근 28일 판매</th><th scope="col" class="n">하루 평균</th><th scope="col" class="n">남은 일수</th><th scope="col">남은 일수 막대 (금 = 14일 · 30일, 끝 = 90일)</th><th scope="col">상태</th></tr></thead>
      <tbody>${list.map(line).join("") || `<tr><td colspan="7"><p class="ov-empty">이 모델군에는 재고 · 판매가 없습니다.</p></td></tr>`}</tbody></table></div>
    <p class="ov-foot">재고 = 이카운트 판매 창고(2.B2B · 3.대원CTS · 5.삼성-안성) 합계, 매일 자동 수집 뒤 갱신 · 하루 평균 = 최근 ${SV_DAYS}일(${md(ASOF - SV_DAYS + 1)}~${md(ASOF)}) 판매 대수 ÷ ${SV_DAYS} · 남은 일수 = 재고 ÷ 하루 평균 · 부속(스탠드 · 브라켓)은 빼고 셉니다</p>
  </div>`;
}
function svAct(t) {
  if (t.dataset.sv === "cat") S.svCat = t.dataset.arg;
  else if (t.dataset.sv === "sort") S.svSort = t.dataset.arg;

function prodViewSeg() {
  return `<div class="seg" role="group" aria-label="상품 보기 방식">${[["compare", "기간 비교"], ["daily", "일별"], ["stock", "재고"]].map(([k, l]) => `<button type="button" data-pview="${k}" aria-pressed="${S.pview === k}">${l}</button>`).join("")}</div>`;
}
function prodDailyData(list) {
  const week = S.pUnit === "week";
  if (week) {
    const ws = pClampWeek(S.pWeekStart), we = pWeekEnd(ws), last = Math.min(we, ASOF);
    const rows = list.map((m) => {
      const arr = D.modelTotals[m.code].qty, days = dayVals(arr, ws, we), prev = dayVals(arr, ws - 7, ws - 7 + (last - ws)).reduce((t, v) => t + v, 0); // 진행 중인 주는 이전 주의 같은 요일까지만 비교
      return { m, days, act: days.slice(0, last - ws + 1).reduce((t, v) => t + v, 0), prev };
    }).filter((r) => r.act || r.prev || r.days.some(Boolean)).sort((x, y) => y.act - x.act);
    tsortApply("daily", rows, dailyKey);
    return { week, ws, we, last, rows, label: `${md(ws)}~${md(we)}${we > ASOF ? " (진행 중)" : ""}`, canPrev: ws > pClampWeek(0), canNext: ws < pClampWeek(1e9) };
  }
  const mo = S.pMonth, ms = monStart(mo), me = monthEnd(ms), last = Math.min(me, ASOF), weeks = monthWeeks(ms, me);
  const rows = list.map((m) => {
    const days = dayVals(D.modelTotals[m.code].qty, ms, me), act = days.slice(0, last - ms + 1).reduce((t, v) => t + v, 0), target = mdlTarget(m, mo);
    return { m, days, act, target, rate: target ? act / target : null };
  }).filter((r) => r.act || r.days.some(Boolean) || r.target).sort((x, y) => y.act - x.act);
  tsortApply("daily", rows, dailyKey);
  return { week, mo, ms, me, last, weeks, rows, pace: me <= ASOF ? 1 : (last - ms + 1) / (me - ms + 1), label: `${monName(mo)}${mo === LM ? " (진행 중)" : ""}`, canPrev: mo > 0, canNext: mo < LM };
}
/* 일별 보기 도구: 주간/월간 단위 + 이전·다음 이동 + 기간 이름 (월간은 목록에서 바로 고르기도 가능) */

/* 일별 보기의 모델 이름: 누르면 그 줄 아래로 마켓별 줄 (마켓별 줄 펼치기) */

function renderProducts() {

/* ---------- 이상 감지: 수집된 판매 숫자로 프로그램이 판정 (문장은 AI가 따로 씀) ----------
   모델·마켓의 마지막 영업일 매출을 직전 28영업일 평균과 비교(평소보다 튄 정도 + 평소 대비 최소 변화율 %), 모델의 주간 평균단가 변동을 확인합니다.
   최소 차이는 마켓마다 매출 규모가 크게 달라 금액 대신 %로 봅니다 (사용자 요청 2026-11-09. 예전 300만원은 네이버에 10%, 11번가에 546%였음)
   기준값과 '정상으로 처리'는 서버 설정에 저장돼 모든 기기·다음 수집 뒤에도 유지됩니다. 대량주문은 주문 단위 자료가 없어 판정하지 않습니다 */
const ALERT_DEF = { warn: 3, watch: 2, modelPct: 30, marketPct: 30, price: 10 };

      title: `${name} 매출 ${up ? "급증" : "급감"}: ${money(v)} (평소 ${money(mean)})`,

      ev: [["기준일", md(day)], ["당일 매출", money(v)], [`최근 ${past.length}영업일 평균`, money(mean)], ["차이", `${up ? "+" : "-"}${money(Math.abs(dev))}`], ["평소 대비", rel === Infinity ? "평소 매출 없음" : `${up ? "+" : "-"}${rel.toFixed(0)}%`], ["평소보다 튄 정도", `${Math.abs(z).toFixed(1)}배`], ...(qtyArr ? [["판매 개수", `평소 하루 ${qMean.toFixed(1)}개 → ${md(day)} ${nf.format(qDay)}개`]] : [])],

      title: `${dname(mdl)} 평균 판매단가 ${pct > 0 ? "상승" : "하락"}: ${money(p0)} → ${money(p1)} (${pct > 0 ? "+" : ""}${pct.toFixed(1)}%)`,
      desc: `${pw.label} 주와 ${wk.label} 주의 유상 판매 평균단가를 비교했습니다.`,
      ev: [["지난 주", money(p0)], ["이번 주", money(p1)], ["변동", `${pct > 0 ? "+" : ""}${pct.toFixed(1)}%`], ["유상 판매량(최근 4주)", units(q4)]] });

async function logout() {
  try { const r = await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" }); if (!r.ok && r.status !== 401) throw new Error(String(r.status)); location.replace("./"); }
  catch (e) { toast("로그아웃하지 못했습니다 (" + e.message + ")"); }
}
let settingsVersion = window.SETTINGS.version;
let confirmedMain = [...S.main], pendingSettings = {}, saving = false, checkingMeta = false, pendingReload = null, reloading = false;
function reloadPage() { try { sessionStorage.setItem("reloadY", String(window.scrollY)); } catch {} location.reload(); }
function reloadView() {
  if (reloading) return;
  reloading = true;
  // 공용 기본으로 시작해 화면을 안 바꿨으면 링크 값을 빼서, 다시 열 때도 공용 기본을 따라가게 합니다
  const useDefault = startedFromDefault && JSON.stringify(viewState()) === JSON.stringify(defaultSnapshot);
  syncViewUrl();
  const url = new URL(location.href);
  if (useDefault) url.searchParams.delete("v");
  // 기본값으로 돌아온 화면도 새로고침 때는 그대로 유지합니다.
  else if (!url.searchParams.has("v")) url.searchParams.set("v", JSON.stringify(viewState()));
  history.replaceState(history.state, "", url.pathname + url.search + url.hash);
  reloadPage();
}
function flushReload() {
  if (pendingReload && !saving && !S.cal && !S.drawer && !S.settings && !$("#sheet").classList.contains("open") && !document.activeElement?.matches("input, textarea, select, [contenteditable='true']")) { const reason = pendingReload; pendingReload = null; reloadView(); }
}
async function checkMeta() {
  if (checkingMeta || saving || reloading) return;
  checkingMeta = true;
  const knownVersion = settingsVersion;
  try {
    const r = await fetch("/api/meta", { credentials: "same-origin" });
    if (r.status === 401) { location.replace("./"); return; }
    if (!r.ok) return;
    const meta = await r.json();
    if (saving || knownVersion !== settingsVersion) return;
    if (settingsVersion != null && meta.settingsVersion !== settingsVersion) pendingReload = "settings";
    else if (window.META.dataVersion != null && meta.dataVersion !== window.META.dataVersion && !pendingReload) pendingReload = "data";
    window.META = meta;
    flushReload();
  } catch {} finally { checkingMeta = false; }
}
let saveLoop = null;
function saveSettings(patch) {
  if (patch.accountAllowlist && saving) { toast("설정을 저장하는 중입니다. 잠시 뒤 다시 눌러 주세요"); return Promise.resolve(false); }
  Object.assign(pendingSettings, patch);
  if (saving) return saveLoop; // 저장 중에 들어온 변경도 같은 저장 흐름이 끝날 때 함께 끝납니다
  saving = true;
  return (saveLoop = flushSettings());
}
async function flushSettings() {
  let succeeded = true;
  while (Object.keys(pendingSettings).length) {
    const values = pendingSettings; pendingSettings = {};
    try {
      if (settingsVersion == null) throw new Error("설정을 다시 불러와 주세요");
      const r = await fetch("/api/settings", { method: "PUT", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ version: settingsVersion, values }) });
      if (r.status === 401) { succeeded = false; pendingSettings = {}; location.replace("./"); break; }
      if (!r.ok) {
        if (r.status === 409) openSheet('<div class="sheet-head"><h2 id="sheetTitle">다른 기기에서 먼저 바꿨습니다. 새로 불러올까요?</h2></div><div class="sheet-actions"><button class="btn primary" type="button" data-reload>새로 불러오기</button><button class="btn" type="button" data-close>닫기</button></div>', true);
        throw new Error(String(r.status));
      }
      const result = await r.json(); settingsVersion = result.version;
      window.SETTINGS.version = result.version; Object.assign(window.SETTINGS.values, values);
      if (values.favoriteModels) { confirmedMain = values.favoriteModels; toast("주요 모델을 저장했습니다. 모든 기기에 반영됩니다"); }
      if (values.defaultView) toast("이 화면을 공용 기본으로 저장했습니다. 다른 기기는 링크 없이 열면 이 화면으로 시작합니다");
    } catch (e) {
      succeeded = false;
      if (values.favoriteModels || pendingSettings.favoriteModels) { S.main = new Set(confirmedMain); render(); if ($("#mainChoices")) drawMainChoices(); if (S.sheetCtx && e.message !== "409") detailSheet(S.sheetCtx); }
      pendingSettings = {};
      if (e.message !== "409") toast("저장하지 못했습니다 (" + e.message + ")");
    }
  }
  saving = false; flushReload();
  return succeeded;
}
const favorites = window.SETTINGS.values.favoriteModels;
if (Array.isArray(favorites) && favorites.length) S.main = new Set(favorites.filter(c => Object.hasOwn(modelByCode, c)));
confirmedMain = [...S.main];
const startParams = new URLSearchParams(location.search);
const startedFromDefault = !startParams.has("v");
try { applyView(startedFromDefault ? window.SETTINGS.values.defaultView : JSON.parse(startParams.get("v"))); } catch {}
const defaultSnapshot = viewState();
setInterval(checkMeta, META_INTERVAL_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkMeta(); });
document.addEventListener("focusout", () => setTimeout(flushReload, 0));

// 필터 줄이 화면 위에 붙었을 때만 아래 구분선을 보여 줍니다
if ("IntersectionObserver" in window) new IntersectionObserver(([en]) => $("#filters").classList.toggle("stuck", !en.isIntersecting && en.boundingClientRect.top < 0)).observe($("#filtersSentinel"));
let rT = null, lastW = window.innerWidth;
// 모바일은 스크롤하면 주소창이 접히고 펴지면서 높이만 바뀌는 resize가 계속 옵니다. 그때마다 다시 그리면 맨 위로 튀므로 폭이 바뀔 때만 그립니다
window.addEventListener("resize", () => {
  if (window.innerWidth === lastW) return;
  lastW = window.innerWidth;
  clearTimeout(rT);
  rT = setTimeout(() => { const y = window.scrollY; keepTableScroll(render); window.scrollTo({ top: y }); }, 150);
});
refreshAlerts(); // 이상 감지 (설정의 기준값·정상 처리 기록 사용)
// 처음 열 때만 뼈대를 보여 줍니다 (시안에서는 0.6초 지연으로 흉내). 업데이트·탭 전환 때는 기존 숫자를 그대로 둡니다
render();
setTimeout(() => {
  S.loading = false; revealFor = true; render();
  // 데이터·설정이 바뀌어 자동으로 새로고침됐을 때는 보던 위치로 돌아갑니다
  try { const y = Number(sessionStorage.getItem("reloadY")); sessionStorage.removeItem("reloadY"); if (y > 0) window.scrollTo({ top: y }); } catch {}
}, 600);
</script>
